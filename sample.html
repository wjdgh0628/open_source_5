<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Floating Marker Example</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.js"></script>

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }

/* 공중에 떠 있는 마커 스타일 */
.floating-marker {
    background: white;
    padding: 6px 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    font-size: 12px;
    border: 1px solid #ddd;
    transform: translateY(0px);
}
</style>
</head>

<body>
<div id="map"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoieXVqaW4wMiIsImEiOiJjbWZ0aW13YXIwdnZpMmlwbzM0YjN3dHN6In0.Us-7fR_re0WUSgzPU8Tjkg';

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/standard',
    center: [-77.04, 38.907],
    zoom: 11.15
});

map.on('load', () => {
    const places = [
        {
            description: '<strong>Muhsinah</strong><p>Jazz-influenced hip hop artist...</p>',
            coordinates: [-77.031706, 38.914581]
        },
        {
            description: '<strong>A Little Night Music</strong><p>Sondheim musical...</p>',
            coordinates: [-77.020945, 38.878241]
        },
        {
            description: '<strong>Truckeroo</strong><p>Food trucks, live music...</p>',
            coordinates: [-77.007481, 38.876516]
        }
    ];

    // Feature마다 Marker 생성
    places.forEach((place) => {

        // 마커용 HTML 엘리먼트
        const el = document.createElement("div");
        el.className = "floating-marker";
        el.innerHTML = place.description;

        // 공중에 떠 있는 Marker 생성
        new mapboxgl.Marker({
            element: el,
            anchor: "bottom",
            altitude: 100   
        })
        .setLngLat(place.coordinates)
        .addTo(map);
    });
});
</script>
</body>
</html>
