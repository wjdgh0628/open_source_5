<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html,body{height:100%;margin:0;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif}
      .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
      .box{padding:24px;text-align:center}
      #err{color:#c00;margin-top:12px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="box">
        <h1>Sign in</h1>
        <div id="gbtn"></div>
        <p id="err"></p>
      </div>
    </div>

    <script>
      (async () => {
        // 1) 서버에서 Client ID 가져오기
        let clientId = "";
        try {
          const r = await fetch("/api/auth/config");
          const j = await r.json();
          clientId = j.clientId || "";
        } catch (e) {
          document.getElementById("err").textContent = "서버에 연결할 수 없습니다.";
          return;
        }
        if (!clientId) {
          document.getElementById("err").textContent = "GOOGLE_CLIENT_ID가 설정되어 있지 않습니다.";
          return;
        }

        // 2) 구글 토큰 콜백
        async function onCredential(resp) {
          try {
            const r = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ credential: resp.credential }),
            });
            if (!r.ok) {
              const e = await r.json().catch(() => ({}));
              document.getElementById("err").textContent = "로그인 실패: " + (e.error || r.status);
              return;
            }
            location.href = "/map";
          } catch {
            document.getElementById("err").textContent = "네트워크 오류";
          }
        }

        // 3) GSI 스크립트 로드 대기 후 버튼 렌더
        (function waitAndInit(){
          if (window.google && google.accounts && google.accounts.id) {
            google.accounts.id.initialize({ client_id: clientId, callback: onCredential });
            google.accounts.id.renderButton(
              document.getElementById("gbtn"),
              { type: "standard", theme: "outline", size: "large", shape: "rect", logo_alignment: "left" }
            );
            // 자동 프롬프트 비활성화 (원하면 아래 주석 해제)
            // google.accounts.id.prompt();
          } else {
            setTimeout(waitAndInit, 50);
          }
        })();
      })();
    </script>
  </body>
</html>
