<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portal</title>
    <style>
      html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
      .wrap{min-height:100%;display:flex;align-items:center;justify-content:center}
      .box{padding:24px;text-align:center;max-width:360px}
      h1{margin:0 0 6px 0;font-size:20px}
      p{margin:4px 0 16px 0;color:#555}
      button{padding:10px 14px;margin:6px 4px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
      button.primary{border-color:#2684ff}
      #err{color:#c00;margin-top:12px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="box">
        <h1>환영합니다</h1>
        <p id="who"></p>
        <div>
          <button class="primary" id="goMap">맵 열기</button>
          <button id="goEditor" style="display:none">에디터 열기</button>
          <button id="logout">로그아웃</button>
        </div>
        <p id="err"></p>
      </div>
    </div>

    <script>
      (async () => {
        try {
          const r = await fetch('/auth/me');
          if (!r.ok) location.href = '/login';
          const { user } = await r.json();
          if (!user) { location.href = '/login'; return; }

          document.getElementById('who').textContent =
            `${user.email}${user.role === 'admin' ? ' · 관리자' : ''}`;

          if (user.role === 'admin') {
            document.getElementById('goEditor').style.display = '';
          }

          document.getElementById('goMap').onclick = () => location.href = '/map';
          document.getElementById('goEditor').onclick = () => location.href = '/editor';
          document.getElementById('logout').onclick = async () => {
            try {
              const r = await fetch('/auth/logout', { method: 'POST' });
              if (r.ok) location.href = '/login';
              else document.getElementById('err').textContent = '로그아웃 실패';
            } catch {
              document.getElementById('err').textContent = '네트워크 오류';
            }
          };
        } catch {
          location.href = '/login';
        }
      })();
    </script>
  </body>
</html>
