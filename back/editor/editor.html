<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polygon Editor</title>
	<link href="editorStyle.css" rel="stylesheet">
</head>

<body>
	<div id="editorRoot">
		<div id="mainPanel">
			<aside id="leftRoomsPanel">
				<h3>방 관리</h3>
				<div class="rooms-section">
					<div class="rooms-section-head">
						<h4>저장됨 (rooms.json)</h4>
						<div class="rooms-head-actions">
							<button id="applyUnsavedBtn" title="팔레트 색상 변경 등 rooms.json에 아직 반영되지 않은 내용을 저장">업데이트</button>
							<button id="reloadRoomsBtn" title="rooms.json이 외부에서 수정된 내용을 다시 불러옵니다">불러오기</button>
						</div>
					</div>
					<div id="savedRoomList" class="rooms-list"></div>
				</div>
				<div class="rooms-section">
					<h4>미저장(작업중)</h4>
					<div id="draftRoomList" class="rooms-list"></div>
				</div>
			</aside>
			<div id="rightPanel">
				<header id="topPanel">
					<div class="top-row">
						<div class="block">
							<label for="buildingSelect">건물</label>
							<select id="buildingSelect"></select>
							<label for="floorSelect">층</label>
							<select id="floorSelect"></select>
						</div>
						<div class="block">
							<label for="floorCoordsInput">층 폴리곤(수동 입력)</label>
							<textarea id="floorCoordsInput" placeholder='[[126.95,37.34], ...]'></textarea>
							<div class="row">
								<button id="applyFloorCoordsBtn">적용</button>
								<button id="copyFloorCoordsBtn">층 좌표 복사</button>
							</div>
						</div>
						<div class="block">
							<label>이미지 조작</label>
							<div class="row">
								<label for="imageOpacity" style="margin-left:8px;">투명도</label>
								<input id="imageOpacity" type="range" min="0" max="100" value="60" />
							</div>
						</div>
					</div>
				</header>

				<main id="middlePanel">
					<div id="canvasContainer">
						<canvas id="editorCanvas"></canvas>
					</div>
				</main>
			</div>
		</div>
	</div>
	<script type="module" src="editorMain.js"></script>
</body>

</html>
